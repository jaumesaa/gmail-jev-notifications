name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Typecheck native extension
        run: xcrun swiftc -typecheck -swift-version 5 native/SafariWebExtensionHandler.swift
      - name: Typecheck setup app
        run: xcrun swiftc -typecheck -swift-version 5 native/ViewController.swift native/AppDelegate.swift
